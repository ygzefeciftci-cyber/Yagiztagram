<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yağıztagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --blue: #0095f6;
    --dark: #262626;
    --gray: #dbdbdb;
    --light: #fafafa;
    --hover: #efefef;
    --red: #ed4956;
    --gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    --shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Sego UI', Roboto, sans-serif; background: var(--light); color: var(--dark); margin: 0; display: flex; justify-content: center; }

  /* ---------- Ekranlar ---------- */
  .screen { display: none; width: 100%; max-width: 935px; min-height: 100vh; background: #fff; border-left: 1px solid var(--gray); border-right: 1px solid var(--gray); box-shadow: var(--shadow); flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Auth ---------- */
  .auth-screen { background: var(--light); justify-content: center; align-items: center; border: none; box-shadow: none; padding: 20px; }
  .auth-card { width: 100%; max-width: 350px; background: #fff; border: 1px solid var(--gray); border-radius: 1px; padding: 40px 32px; text-align: center; }
  .auth-title { font-family: 'Cookie', cursive; font-size: 44px; color: var(--dark); margin-bottom: 24px; cursor: pointer; }
  .auth-input { width: 100%; border: 1px solid var(--gray); border-radius: 4px; padding: 10px 12px; font-size: 14px; margin-bottom: 8px; outline: none; }
  .auth-input:focus { border-color: var(--dark); }
  .auth-btn { width: 100%; background: var(--blue); color: #fff; border: none; border-radius: 4px; padding: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
  .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-divider { margin: 16px 0; font-size: 13px; color: #8e8e8e; position: relative; }
  .auth-divider::before, .auth-divider::after { content: ''; position: absolute; top: 50%; width: 38%; height: 1px; background: var(--gray); }
  .auth-divider::before { left: 0; }
  .auth-divider::after { right: 0; }
  .auth-link { background: transparent; border: none; color: var(--blue); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; }
  .app-mention { font-size: 14px; color: #8e8e8e; margin-top: 16px; }

  /* ---------- Header ---------- */
  header { height: 54px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--gray); position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Cookie', cursive; font-size: 34px; color: var(--dark); cursor: pointer; }
  .logo::after { content: ' Yağıztagram'; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; margin-left: 6px; vertical-align: -6px; }
  .header-right { display: flex; align-items: center; gap: 26px; }
  .header-right a { color: var(--dark); text-decoration: none; font-size: 20px; }
  .dm-badge { position: absolute; top: -4px; right: -6px; width: 10px; height: 10px; background: var(--red); border-radius: 50%; border: 2px solid #fff; font-size: 0; }

  /* ---------- Stories ---------- */
  .stories { height: 118px; border-bottom: 1px solid var(--gray); background: #fff; overflow-x: auto; white-space: nowrap; padding: 8px 0 0 8px; scrollbar-width: none; }
  .stories::-webkit-scrollbar { display: none; }
  .story-bubble { display: inline-flex; flex-direction: column; align-items: center; width: 80px; padding: 0 8px; position: relative; cursor: pointer; }
  .story-ring { width: 70px; height: 70px; border-radius: 50%; padding: 2px; background: var(--gradient); margin-bottom: 6px; position: relative; }
  .story-ring img { width: 66px; height: 66px; border-radius: 50%; object-fit: cover; background: #fff; border: 2px solid #fff; }
  .story-ring.me { border: none; }
  .story-ring.live::after { content: 'LIVE'; position: absolute; top: 2px; left: 2px; font-size: 8px; font-weight: 700; color: #fff; background: var(--red); padding: 1px 4px; border-radius: 4px; }
  .story-bubble span { font-size: 12px; font-weight: 500; width: 66px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: var(--dark); }
  .story-add { flex-direction: row; gap: 8px; width: auto; padding: 0 8px; }
  .story-add .story-ring { width: 56px; height: 56px; margin-bottom: 0; }
  .story-add .story-ring img { width: 52px; height: 52px; border: 1px solid var(--gray); }
  .story-add span { width: auto; }

  /* ---------- Feed ---------- */
  .feed { flex: 1; overflow-y: auto; background: #fff; }
  .post { border-bottom: 1px solid var(--gray); padding: 16px 0; }
  .post-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-bottom: 10px; }
  .post-user { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .post-user img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gradient); }
  .post-user-info { display: flex; flex-direction: column; }
  .post-username { font-weight: 600; font-size: 14px; color: var(--dark); }
  .post-location { font-size: 12px; color: #8e8e8e; }
  .post-options { color: var(--dark); font-size: 20px; cursor: pointer; padding: 4px; }
  .post-image-wrapper { width: 100%; position: relative; background: #fafafa; cursor: pointer; }
  .post-image-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .post-actions { display: flex; justify-content: space-between; padding: 8px 16px 4px; }
  .post-actions-left { display: flex; gap: 8px; }
  .post-action { font-size: 24px; color: var(--dark); cursor: pointer; padding: 4px; line-height: 1; }
  .post-action.liked { color: var(--red); }
  .post-bookmark { font-size: 24px; cursor: pointer; padding: 4px; color: var(--dark); }
  .post-likes { padding: 4px 16px; font-size: 14px; font-weight: 600; color: var(--dark); }
  .post-caption { padding: 4px 16px 8px; font-size: 14px; line-height: 1.4; color: var(--dark); }
  .post-caption .username { font-weight: 600; }
  .post-time { font-size: 10px; color: #8e8e8e; padding: 0 16px 8px; }
  .post-comment-area { padding: 4px 16px; border-top: 1px solid var(--gray); }
  .post-comment-input { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .post-comment-input input { flex: 1; border: none; outline: none; font-size: 14px; color: var(--dark); background: transparent; padding: 8px 0; }
  .post-comment-btn { color: var(--blue); font-size: 14px; font-weight: 600; cursor: pointer; }
  .post-comment-btn:disabled { color: #c7c7c7; cursor: not-allowed; }
  .comments-list { display: flex; flex-direction: column; gap: 4px; }
  .comment-item { font-size: 14px; padding: 2px 0; }
  .comment-item .username { font-weight: 600; }

  /* ---------- Create ---------- */
  .create-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--gray); background: #fff; }
  .create-bar input { flex: 1; border: 1px solid var(--gray); border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; }
  .create-bar input:focus { border-color: var(--dark); }
  .create-btn { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .create-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* ---------- Bottom Nav ---------- */
  .bottom-nav { display: flex; justify-content: space-around; height: 54px; border-top: 1px solid var(--gray); background: #fff; z-index: 50; }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 25%; font-size: 22px; color: #8e8e8e; cursor: pointer; padding: 4px 0; }
  .nav-item.active { color: var(--dark); }
  .nav-item span { font-size: 10px; margin-top: 2px; font-weight: 500; }
  .nav-item i { line-height: 1; }

  /* ---------- Sidebar (desktop) ---------- */
  .sidebar { display: none; width: 320px; background: #fff; border-left: 1px solid var(--gray); border-right: 1px solid var(--gray); padding: 16px 0; }
  .sidebar-section { margin-bottom: 24px; padding: 0 16px; }
  .sidebar-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--dark); }
  .suggestion { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .suggestion-info { display: flex; align-items: center; gap: 10px; flex: 1; }
  .suggestion img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .suggestion-name { font-weight: 600; font-size: 14px; color: var(--dark); }
  .suggestion-handle { font-size: 12px; color: #8e8e8e; }
  .follow-btn { font-size: 14px; font-weight: 600; color: var(--blue); background: transparent; border: 1px solid var(--blue); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  .follow-btn.following { background: var(--dark); color: #fff; border-color: var(--dark); }
  .see-all { font-size: 12px; font-weight: 600; color: #8e8e8e; cursor: pointer; }

  /* ---------- Profile ---------- */
  .profile-header { padding: 20px 16px; border-bottom: 1px solid var(--gray); background: #fff; }
  .profile-top { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .profile-avatar { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gradient); cursor: pointer; }
  .profile-meta { flex: 1; }
  .profile-name { font-size: 24px; font-weight: 700; color: var(--dark); }
  .profile-username { font-size: 16px; color: #8e8e8e; margin-top: 4px; }
  .profile-bio { font-size: 15px; line-height: 1.4; color: var(--dark); margin: 10px 0 6px; white-space: pre-line; }
  .profile-stats { display: flex; gap: 20px; margin-top: 10px; font-size: 14px; }
  .profile-stats div { cursor: pointer; }
  .profile-stats b { display: block; font-weight: 600; color: var(--dark); }
  .profile-stats span { color: #8e8e8e; }
  .profile-buttons { display: flex; gap: 8px; margin-top: 14px; }
  .profile-btn { flex: 1; border: 1px solid var(--gray); background: #fff; color: var(--dark); border-radius: 4px; padding: 6px 0; font-size: 14px; font-weight: 600; cursor: pointer; }
  .profile-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .profile-btn.outline { border-color: var(--gray); }
  .profile-tabs { display: flex; border-bottom: 1px solid var(--gray); }
  .profile-tab { flex: 1; padding: 14px 0; text-align: center; font-size: 24px; color: var(--dark); cursor: pointer; border-bottom: 3px solid transparent; }
  .profile-tab.active { border-bottom-color: var(--dark); color: var(--dark); }
  .profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--gray); }
  .profile-grid img { width: 100%; padding-bottom: 100%; object-fit: cover; background: #fafafa; cursor: pointer; }
  .profile-empty { padding: 40px 16px; text-align: center; color: #8e8e8e; }
  .edit-profile-btn { margin-left: 8px; font-size: 14px; color: var(--dark); cursor: pointer; }

  /* ---------- Messages ---------- */
  .messages-header { height: 54px; background: #fff; border-bottom: 1px solid var(--gray); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .messages-header h2 { font-size: 16px; font-weight: 600; }
  .messages-list { height: calc(100vh - 108px); overflow-y: auto; background: #fff; }
  .message-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--gray); cursor: pointer; }
  .message-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .message-info { flex: 1; }
  .message-name { font-weight: 600; font-size: 14px; color: var(--dark); }
  .message-text { font-size: 14px; color: #8e8e8e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .message-time { font-size: 12px; color: #8e8e8e; }
  .chat-screen { display: none; flex-direction: column; height: 100vh; background: #fff; }
  .chat-screen.active { display: flex; }
  .chat-header { height: 54px; background: #fff; border-bottom: 1px solid var(--gray); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .chat-back { font-size: 20px; cursor: pointer; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #fafafa; }
  .chat-msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; font-size: 14px; margin-bottom: 8px; }
  .chat-msg.me { background: var(--blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 0; }
  .chat-msg.other { background: #fff; color: var(--dark); border: 1px solid var(--gray); border-bottom-left-radius: 0; }
  .chat-input-area { padding: 8px 16px; border-top: 1px solid var(--gray); background: #fff; display: flex; gap: 8px; }
  .chat-input-area input { flex: 1; border: 1px solid var(--gray); border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; }
  .chat-send { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-weight: 600; cursor: pointer; }

  /* ---------- Story Modal ---------- */
  .story-modal { display: none; position: fixed; inset: 0; z-index: 250; background: #000; color: #fff; flex-direction: column; align-items: center; justify-content: center; }
  .story-modal.open { display: flex; }
  .story-header { position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
  .story-close { font-size: 24px; cursor: pointer; }
  .story-user { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
  .story-user img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--gradient); }
  .story-progress { position: absolute; top: 58px; left: 0; right: 0; height: 4px; display: flex; z-index: 10; }
  .story-step { flex: 1; height: 4px; background: rgba(255,255,255,0.3); position: relative; overflow: hidden; }
  .story-step .fill { height: 100%; background: #fff; width: 0%; animation: storyFill 10s linear forwards; }
  @keyframes storyFill { to { width: 100%; } }
  .story-viewer { width: 100vw; height: calc(100vh - 116px); background: #000; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .story-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .story-tap { position: absolute; top: 0; bottom: 0; width: 25%; cursor: pointer; z-index: 5; }
  .story-tap.left { left: 0; }
  .story-tap.right { right: 0; }
  .story-controls { position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 24px; z-index: 10; pointer-events: none; }
  .story-controls > * { pointer-events: auto; }

  /* ---------- Search ---------- */
  .search-screen { padding: 0; }
  .search-bar { height: 54px; background: #fff; border-bottom: 1px solid var(--gray); padding: 0 16px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; }
  .search-bar input { flex: 1; border: 1px solid var(--gray); border-radius: 8px; padding: 8px 12px; font-size: 14px; outline: none; }
  .search-results { padding: 16px; }
  .search-user { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--gray); cursor: pointer; }
  .search-user img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

  /* ---------- Modals ---------- */
  .modal { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.5); }
  .modal.open { display: flex; align-items: center; justify-content: center; }
  .modal-content { background: #fff; border-radius: 8px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 24px; }
  .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .close-modal { position: absolute; top: 16px; right: 16px; font-size: 22px; cursor: pointer; color: #8e8e8e; }
  .user-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--gray); cursor: pointer; }
  .user-row img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .user-info { flex: 1; }
  .user-name { font-weight: 600; font-size: 14px; color: var(--dark); }
  .user-handle { font-size: 12px; color: #8e8e8e; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 16px; border-radius: 4px; font-size: 14px; z-index: 1000; display: none; }

  @media (min-width: 936px) {
    body { padding: 20px 0; }
    .app-wrapper-main { border-radius: 1px; overflow: hidden; }
    .sidebar { display: block; }
    .bottom-nav { display: none; }
    .header-right { gap: 36px; }
  }
  @font-face { font-family: 'Cookie'; src: local('Cookie'), local('Cookie-Regular'); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ========== AUTH SCREEN ========== -->
<div class="screen active" id="auth-screen">
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-title" onclick="app.showTab('login')">Yağıztagram</div>
      <div id="auth-form">
        <div id="login-form">
          <input type="text" id="login-user" class="auth-input" placeholder="Kullanıcı adı">
          <input type="password" id="login-pass" class="auth-input" placeholder="Şifre">
          <button class="auth-btn" id="login-btn" onclick="app.login()">Giriş Yap</button>
          <div class="auth-divider">veya</div>
          <button class="auth-link" onclick="app.showTab('register')">Yeni hesap oluştur</button>
        </div>
        <div id="register-form" class="hidden">
          <input type="text" id="reg-name" class="auth-input" placeholder="Adınız">
          <input type="text" id="reg-user" class="auth-input" placeholder="Kullanıcı adı">
          <input type="password" id="reg-pass" class="auth-input" placeholder="Şifre">
          <button class="auth-btn" id="reg-btn" onclick="app.register()">Kayıt Ol</button>
          <div class="auth-divider">veya</div>
          <button class="auth-link" onclick="app.showTab('login')">Zaten hesabınız var mı? Giriş yap</button>
        </div>
      </div>
      <div id="auth-error" style="color: var(--red); font-size: 13px; margin-top: 10px; display: none;"></div>
      <div class="app-mention">Sadece aileniz için özel Instagram</div>
    </div>
  </div>
</div>

<!-- ========== MAIN APP ========== -->
<div class="screen" id="app-screen">
  <div class="app-wrapper-main">
    <header id="main-header">
      <div class="logo" onclick="app.goHome()"></div>
      <div class="header-right">
        <a href="#" class="dm" title="Mesajlar" onclick="app.goMessages()"><i class="fa-regular fa-facebook-messenger"></i><span class="dm-badge" id="dm-badge"></span></a>
        <a href="#" title="Yayın oluştur" onclick="app.goCreate()"><i class="fa-regular fa-square-plus"></i></a>
        <a href="#" title="Bildirimler" onclick="app.goActivity()"><i class="fa-regular fa-heart"></i></a>
        <a href="#" title="Profil" onclick="app.goProfileMe()"><i class="fa-regular fa-user"></i></a>
      </div>
    </header>

    <div id="home-view" class="feed active">
      <div class="stories" id="stories"></div>
      <div class="create-bar">
        <div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--gradient); flex-shrink: 0;"></div>
        <input type="text" placeholder="Yağıztagram'a bir gönderi yap..." readonly onclick="app.goCreate()">
        <button class="create-btn" onclick="app.goCreate()">Gönderi Oluştur</button>
      </div>
      <div id="feed"></div>
    </div>

    <div id="search-view" class="search-screen hidden">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Ara" oninput="app.searchUsers()">
      </div>
      <div class="search-results" id="search-results"></div>
    </div>

    <div id="create-view" class="hidden">
      <div class="messages-header">
        <div class="chat-back" onclick="app.goHome()"><i class="fa-solid fa-arrow-left"></i></div>
        <h2>Yeni Gönderi</h2>
        <div></div>
      </div>
      <div style="padding: 16px;">
        <input type="file" id="create-image" accept="image/*" onchange="app.previewCreateImage(this)">
        <div id="create-preview" style="margin-top: 12px; display: none; width: 100%; max-height: 400px; overflow: hidden; border-radius: 8px;"></div>
        <textarea id="create-caption" placeholder="Başlık ekle..." style="width: 100%; border: none; outline: none; font-size: 14px; margin-top: 12px; padding: 8px; resize: vertical;"></textarea>
        <button class="create-btn" style="margin-top: 16px; width: 100%;" onclick="app.createPost()">Paylaş</button>
      </div>
    </div>

    <div id="profile-view" class="hidden">
      <div class="profile-header">
        <div class="profile-top">
          <img class="profile-avatar" id="prof-avatar" src="" alt="" onclick="app.changeAvatar()">
          <div class="profile-meta">
            <div class="profile-name" id="prof-name">Yağız</div>
            <div class="profile-username" id="prof-username">@yagiz</div>
            <div class="profile-bio" id="prof-bio"></div>
            <div class="profile-stats">
              <div onclick="app.showProfileTab('posts')"><b id="prof-posts">0</b><span>Gönderi</span></div>
              <div onclick="app.showProfileTab('followers')"><b id="prof-followers">0</b><span>Takipçi</span></div>
              <div onclick="app.showProfileTab('following')"><b id="prof-following">0</b><span>Takip edilen</span></div>
            </div>
          </div>
          <button class="profile-btn primary" id="prof-follow-btn" onclick="app.toggleFollow()">Takip Et</button>
          <button class="edit-profile-btn" onclick="app.editBio()">Biyografi Düzenle</button>
        </div>
        <div class="profile-tabs">
          <div class="profile-tab active" onclick="app.showProfileTab('posts')"><i class="fa-regular fa-th-large"></i></div>
          <div class="profile-tab" onclick="app.showProfileTab('reels')"><i class="fa-regular fa-clock"></i></div>
          <div class="profile-tab" onclick="app.showProfileTab('tags')"><i class="fa-regular fa-bookmark"></i></div>
        </div>
      </div>
      <div id="profile-grid" class="profile-grid"></div>
      <div class="profile-empty" id="profile-empty" style="display:none;">Gönderi yok.</div>
      <div style="position:absolute; top:12px; right:16px;">
        <i class="fa-regular fa-xmark" style="font-size:22px; cursor:pointer;" onclick="app.goHome()"></i>
      </div>
    </div>

    <div id="messages-view" class="hidden">
      <div class="messages-header">
        <div class="chat-back" onclick="app.goHome()"><i class="fa-solid fa-arrow-left"></i></div>
        <h2>Mesajlar</h2>
        <div></div>
      </div>
      <div class="messages-list" id="messages-list"></div>
    </div>

    <div id="chat-view" class="chat-screen hidden">
      <div class="chat-header">
        <div class="chat-back" onclick="app.backToMessages()"><i class="fa-solid fa-arrow-left"></i></div>
        <div id="chat-title" style="font-weight:600;font-size:16px;"></div>
        <div></div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Mesaj gönder..." onkeypress="if(event.key==='Enter') app.sendMessage()">
        <button class="chat-send" onclick="app.sendMessage()">Gönder</button>
      </div>
    </div>

  </div>
</div>

<!-- Sidebar (desktop) -->
<div class="sidebar">
  <div class="sidebar-section">
    <div class="sidebar-title">Keşfedilebilecek hesaplar</div>
    <div id="suggestions"></div>
    <div class="see-all">Tümünü gör</div>
  </div>
</div>

<!-- ========== STORY MODAL ========== -->
<div class="story-modal" id="story-modal">
  <div class="story-header">
    <div class="story-close" onclick="app.closeStory()"><i class="fa-regular fa-xmark"></i></div>
    <div class="story-user" id="story-user"><img src=""><span></span></div>
    <div style="font-size:20px;"></div>
  </div>
  <div class="story-progress" id="story-progress"></div>
  <div class="story-viewer" id="story-viewer"></div>
  <div class="story-tap left" onclick="app.prevStory()"></div>
  <div class="story-tap right" onclick="app.nextStory()"></div>
  <div class="story-controls">
    <div style="display:flex; align-items:center; gap:10px;">
      <img src="" class="story-avatar" style="width:32px;height:32px;border-radius:50%;border:2px solid #ff00cc;">
      <div style="color:#fff;font-weight:600;font-size:14px;" id="story-owner"></div>
    </div>
    <div style="color:#fff;font-size:14px;">Hikaye · 방금 önce</div>
    <div style="display:flex; gap:14px; font-size:20px; color:#fff;">
      <i class="fa-regular fa-heart" style="cursor:pointer;" onclick="event.stopPropagation(); app.likeStory()"></i>
      <i class="fa-regular fa-paper-plane" style="cursor:pointer;"></i>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let token = localStorage.getItem('yt_token');
let currentUser = null;
let chatWith = null;
let storyInterval, storyIndex = 0, storyItems = [];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(API + path, { ...opts, headers }).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Hata oluştu.');
    return data;
  });
}

const app = {
  init() {
    if (token) {
      api('/api/me').then(d => {
        currentUser = d.user;
        this.showApp();
      }).catch(() => {
        localStorage.removeItem('yt_token');
        token = null;
      });
    }
  },

  showTab(tab) {
    document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
    document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
    document.getElementById('auth-error').style.display = 'none';
  },

  async login() {
    const u = document.getElementById('login-user').value;
    const p = document.getElementById('login-pass').value;
    if (!u || !p) return showToast('Tüm alanları doldurun.');
    try {
      const d = await api('/api/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
      token = d.token;
      localStorage.setItem('yt_token', token);
      currentUser = d.user;
      this.showApp();
    } catch (e) { document.getElementById('auth-error').style.display = 'block'; document.getElementById('auth-error').textContent = e.message; }
  },

  async register() {
    const name = document.getElementById('reg-name').value;
    const u = document.getElementById('reg-user').value;
    const p = document.getElementById('reg-pass').value;
    if (!name || !u || !p) return showToast('Tüm alanları doldurun.');
    try {
      await api('/api/register', { method: 'POST', body: JSON.stringify({ username: u, password: p, full_name: name }) });
      showToast('Kayıt başarılı, giriş yapın.');
      this.showTab('login');
    } catch (e) { showToast(e.message); }
  },

  logout() {
    localStorage.removeItem('yt_token');
    token = null;
    currentUser = null;
    document.getElementById('auth-screen').classList.add('active');
    document.getElementById('app-screen').classList.remove('active');
    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('auth-screen').classList.add('active');
  },

  showApp() {
    document.getElementById('auth-screen').classList.remove('active');
    document.getElementById('app-screen').classList.add('active');
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    this.goHome();
  },

  // ---------- Navigation ----------
  goHome() {
    this.hideAllViews();
    document.getElementById('home-view').classList.remove('hidden');
    document.getElementById('home-view').classList.add('active');
    this.loadStories();
    this.loadFeed();
    this.loadSuggestions();
  },
  goSearch() {
    this.hideAllViews();
    document.getElementById('search-view').classList.remove('hidden');
    document.getElementById('search-view').classList.add('active');
    document.getElementById('search-input').focus();
    this.searchUsers();
  },
  goCreate() {
    this.hideAllViews();
    document.getElementById('create-view').classList.remove('hidden');
    document.getElementById('create-view').classList.add('active');
    document.getElementById('create-image').value = '';
    document.getElementById('create-preview').style.display = 'none';
    document.getElementById('create-caption').value = '';
  },
  goActivity() { showToast('Bildirimler henüz yok.'); },
  goProfileMe() { this.goProfile(currentUser.username); },
  goMessages() {
    this.hideAllViews();
    document.getElementById('messages-view').classList.remove('hidden');
    document.getElementById('messages-view').classList.add('active');
    this.loadConversations();
  },
  hideAllViews() {
    document.querySelectorAll('#home-view, #search-view, #create-view, #profile-view, #messages-view, #chat-view').forEach(v => {
      v.classList.add('hidden');
      v.classList.remove('active');
    });
  },

  // ---------- Feed ----------
  async loadStories() {
    try {
      const d = await api('/api/stories');
      const el = document.getElementById('stories');
      let html = `<div class="story-bubble story-add" onclick="app.goCreate()">
        <div class="story-ring me"><img src="${currentUser.avatar || 'https://i.pravatar.cc/150?img=11'}"></div>
        <span>Sizin hikayeniz</span>
      </div>`;
      d.stories.forEach(s => {
        html += `<div class="story-bubble" onclick="app.openStory('${s.user_id}', '${s.id}')">
          <div class="story-ring"><img src="${s.image_url}"></div>
          <span>${s.full_name || s.username}</span>
        </div>`;
      });
      el.innerHTML = html;
    } catch (e) {}
  },
  async loadFeed() {
    try {
      const d = await api('/api/feed');
      const el = document.getElementById('feed');
      let html = '';
      d.posts.forEach(p => {
        html += this.postHTML(p);
      });
      el.innerHTML = html;
    } catch (e) { showToast('Akış yüklenemedi.'); }
  },
  postHTML(p) {
    const liked = p.liked ? 'liked' : '';
    const heartIcon = p.liked ? 'fa-solid' : 'fa-regular';
    return `
      <div class="post" id="post-${p.id}">
        <div class="post-header">
          <div class="post-user" onclick="app.goProfile('${p.username}')">
            <img src="${p.avatar || 'https://i.pravatar.cc/150'}" alt="">
            <div class="post-user-info">
              <div class="post-username">${escapeHtml(p.full_name || p.username)}</div>
              <div class="post-location">@${escapeHtml(p.username)}</div>
            </div>
          </div>
          <div class="post-options" onclick="event.stopPropagation(); app.goProfile('${p.username}')"><i class="fa-regular fa-ellipsis"></i></div>
        </div>
        <div class="post-image-wrapper" onclick="app.toggleLike(${p.id})">
          <img src="${p.image_url}" alt="">
        </div>
        <div class="post-actions">
          <div class="post-actions-left">
            <div class="post-action ${liked}" id="heart-${p.id}" onclick="event.stopPropagation(); app.toggleLike(${p.id})"><i class="${heartIcon} fa-heart"></i></div>
            <div class="post-action" onclick="app.openComments(${p.id})"><i class="fa-regular fa-comment"></i></div>
            <div class="post-action" onclick="app.openDM(${p.user_id}, '${escapeHtml(p.full_name || p.username)}')"><i class="fa-regular fa-paper-plane"></i></div>
          </div>
          <div class="post-bookmark" onclick="event.stopPropagation()"><i class="fa-regular fa-bookmark"></i></div>
        </div>
        <div class="post-likes" id="likes-${p.id}">
          <span>${p.like_count.toLocaleString('tr-TR')}</span> beğeni
        </div>
        <div class="post-caption">
          <span class="username">${escapeHtml(p.full_name || p.username)}</span> ${escapeHtml(p.caption)}
        </div>
        <div class="post-time">${relativeTime(p.created_at)}</div>
        <div class="post-comment-area" id="comment-area-${p.id}" style="display:none;">
          <div class="post-comment-input">
            <input type="text" id="cinput-${p.id}" placeholder="Yorum ekle...">
            <button class="post-comment-btn" onclick="app.addComment(${p.id})">Yorumla</button>
          </div>
          <div class="comments-list" id="clist-${p.id}"></div>
        </div>
      </div>`;
  },

  async toggleLike(postId) {
    try {
      const d = await api(`/api/posts/${postId}/like`, { method: 'POST' });
      const heart = document.getElementById('heart-' + postId);
      const likesEl = document.getElementById('likes-' + postId);
      if (heart) {
        heart.innerHTML = `<i class="fa-${d.liked ? 'solid' : 'regular'} fa-heart"></i>`;
        heart.className = 'post-action ' + (d.liked ? 'liked' : '');
      }
      if (likesEl) {
        const n = likesEl.querySelector('span');
        let cur = parseInt(n.textContent.replace(/\D/g, '')) || 0;
        cur += d.liked ? 1 : -1;
        n.textContent = cur.toLocaleString('tr-TR');
      }
    } catch (e) { showToast(e.message); }
  },
  async openComments(postId) {
    const area = document.getElementById('comment-area-' + postId);
    area.style.display = area.style.display === 'none' ? 'block' : 'none';
    if (area.style.display === 'block') this.loadComments(postId);
  },
  async loadComments(postId) {
    try {
      const d = await api(`/api/posts/${postId}/comments`);
      const el = document.getElementById('clist-' + postId);
      el.innerHTML = d.comments.map(c => `
        <div class="comment-item"><span class="username">${escapeHtml(c.full_name || c.username)}</span> ${escapeHtml(c.text)}</div>
      `).join('');
    } catch (e) {}
  },
  async addComment(postId) {
    const input = document.getElementById('cinput-' + postId);
    const text = input.value.trim();
    if (!text) return;
    try {
      await api(`/api/posts/${postId}/comment`, { method: 'POST', body: JSON.stringify({ text }) });
      input.value = '';
      this.loadComments(postId);
    } catch (e) { showToast(e.message); }
  },

  // ---------- Profile ----------
  async goProfile(username) {
    this.hideAllViews();
    document.getElementById('profile-view').classList.remove('hidden');
    document.getElementById('profile-view').classList.add('active');
    try {
      const d = await api(`/api/profile/${username}`);
      document.getElementById('prof-name').textContent = d.user.full_name;
      document.getElementById('prof-username').textContent = '@' + d.user.username;
      document.getElementById('prof-bio').textContent = d.user.bio;
      document.getElementById('prof-avatar').src = d.user.avatar || 'https://i.pravatar.cc/150';
      document.getElementById('prof-posts').textContent = d.stats.posts;
      document.getElementById('prof-followers').textContent = d.stats.followers;
      document.getElementById('prof-following').textContent = d.stats.following;
      const btn = document.getElementById('prof-follow-btn');
      if (d.user.isOwn) {
        btn.textContent = 'Profili Düzenle';
        btn.className = 'profile-btn primary';
        btn.onclick = () => this.editBio();
      } else {
        btn.textContent = d.user.isFollowing ? 'Takip Bırak' : 'Takip Et';
        btn.className = 'profile-btn ' + (d.user.isFollowing ? 'following' : '');
        btn.onclick = () => this.toggleFollowUser(d.user.id);
      }
      this.renderProfileGrid(d.posts);
    } catch (e) { showToast(e.message); }
  },
  renderProfileGrid(posts) {
    const el = document.getElementById('profile-grid');
    const empty = document.getElementById('profile-empty');
    if (posts.length === 0) { el.style.display = 'none'; empty.style.display = 'block'; }
    else {
      el.style.display = 'grid';
      empty.style.display = 'none';
      el.innerHTML = posts.map(p => `<img src="${p.image_url}" alt="">`).join('');
    }
  },
  showProfileTab(tab) {
    document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
    event.currentTarget.classList.add('active');
  },
  async toggleFollowUser(userId) {
    try {
      const d = await api(`/api/follow/${userId}`, { method: 'POST' });
      this.goProfile(currentUser.username); // refresh
    } catch (e) { showToast(e.message); }
  },
  async toggleFollow() {
    const btn = document.getElementById('prof-follow-btn');
    if (btn.textContent === 'Profili Düzenle') return this.editBio();
    const isFollowing = btn.classList.contains('following');
    try {
      await api(`/api/follow/${currentUser.id}`, { method: 'POST' });
      btn.classList.toggle('following');
      btn.textContent = isFollowing ? 'Takip Et' : 'Takip Bırak';
      const fc = document.getElementById('prof-followers');
      let c = parseInt(fc.textContent) || 0;
      fc.textContent = isFollowing ? c - 1 : c + 1;
    } catch (e) { showToast(e.message); }
  },
  editBio() {
    const bio = prompt('Yeni biyografi:', document.getElementById('prof-bio').textContent);
    if (bio === null) return;
    api('/api/me').then(async d => {
      await api('/api/users/' + currentUser.id, { method: 'PUT', body: JSON.stringify({ bio }) }).catch(() => {});
      showToast('Biyografi güncellendi.');
      this.goProfile(currentUser.username);
    }).catch(() => showToast('Güncellenemedi.'));
  },
  changeAvatar() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('image', file);
      try {
        const res = await fetch(API + '/api/posts', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: fd,
        });
        // Simplified: avatar change not implemented as separate endpoint, upload as post instead
        showToast('Profil fotoğrırı olarak gönderildi (gönderi olarak paylaşıldı).');
      } catch (err) { showToast('Yüklenemedi.'); }
    };
    input.click();
  },

  // ---------- Create Post ----------
  previewCreateImage(input) {
    const file = input.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const prev = document.getElementById('create-preview');
    prev.innerHTML = `<img src="${url}" style="width:100%;height:auto;max-height:400px;object-fit:cover;border-radius:8px;">`;
    prev.style.display = 'block';
  },
  async createPost() {
    const input = document.getElementById('create-image');
    if (!input.files[0]) return showToast('Resim seçmelisiniz.');
    const caption = document.getElementById('create-caption').value;
    const fd = new FormData();
    fd.append('image', input.files[0]);
    fd.append('caption', caption);
    try {
      const res = await fetch(API + '/api/posts', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: fd,
      });
      if (!res.ok) throw new Error('Paylaşım başarısız.');
      showToast('Paylaşıldı!');
      this.goHome();
    } catch (e) { showToast(e.message); }
  },

  // ---------- Search ----------
  async searchUsers() {
    const q = document.getElementById('search-input').value;
    try {
      const d = await api(`/api/users?q=${encodeURIComponent(q)}`);
      const el = document.getElementById('search-results');
      el.innerHTML = d.users.map(u => `
        <div class="search-user" onclick="app.goProfile('${u.username}')">
          <img src="${u.avatar || 'https://i.pravatar.cc/150'}" alt="">
          <div>
            <div class="user-name">${escapeHtml(u.full_name || u.username)}</div>
            <div class="user-handle">@${escapeHtml(u.username)}</div>
          </div>
        </div>
      `).join('');
    } catch (e) {}
  },
  async loadSuggestions() {
    try {
      const d = await api('/api/users');
      const el = document.getElementById('suggestions');
      el.innerHTML = d.users.filter(u => u.id !== currentUser.id).slice(0, 6).map(u => `
        <div class="suggestion">
          <div class="suggestion-info">
            <img src="${u.avatar || 'https://i.pravatar.cc/150'}" alt="">
            <div>
              <div class="suggestion-name">${escapeHtml(u.full_name || u.username)}</div>
              <div class="suggestion-handle">@${escapeHtml(u.username)}</div>
            </div>
          </div>
          <button class="follow-btn" onclick="event.stopPropagation(); app.toggleFollowUser(${u.id})">Takip Et</button>
        </div>
      `).join('');
    } catch (e) {}
  },

  // ---------- Messages ----------
  async loadConversations() {
    try {
      const d = await api('/api/conversations');
      const el = document.getElementById('messages-list');
      el.innerHTML = d.conversations.map(c => `
        <div class="message-item" onclick="app.openChat(${c.id}, '${c.full_name || c.username}')">
          <img src="${c.avatar || 'https://i.pravatar.cc/150'}" alt="">
          <div class="message-info">
            <div class="message-name">${escapeHtml(c.full_name || c.username)}</div>
            <div class="message-text">${escapeHtml(c.last_message || '')}</div>
          </div>
          <div class="message-time">${relativeTime(c.last_time)}</div>
        </div>
      `).join('');
    } catch (e) {}
  },
  openChat(userId, name) {
    chatWith = userId;
    document.getElementById('chat-title').textContent = name;
    this.hideAllViews();
    document.getElementById('chat-view').classList.remove('hidden');
    document.getElementById('chat-view').classList.add('active');
    this.loadMessages();
  },
  backToMessages() {
    chatWith = null;
    this.hideAllViews();
    document.getElementById('messages-view').classList.remove('hidden');
    document.getElementById('messages-view').classList.add('active');
    this.loadConversations();
  },
  async loadMessages() {
    if (!chatWith) return;
    try {
      const d = await api(`/api/messages/${chatWith}`);
      const el = document.getElementById('chat-messages');
      el.innerHTML = d.messages.map(m => `
        <div class="chat-msg ${m.sender_id === currentUser.id ? 'me' : 'other'}">${escapeHtml(m.text)}</div>
      `).join('');
      el.scrollTop = el.scrollHeight;
    } catch (e) {}
  },
  async sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !chatWith) return;
    try {
      await api('/api/messages', { method: 'POST', body: JSON.stringify({ receiver_id: chatWith, text }) });
      input.value = '';
      this.loadMessages();
    } catch (e) { showToast(e.message); }
  },

  // ---------- Stories ----------
  async openStory(userId, storyId) {
    const d = await api(`/api/profile/${encodeURIComponent(await this.getUsernameById(userId))}`);
    // simplified: open modal with own story
    const modal = document.getElementById('story-modal');
    const viewer = document.getElementById('story-viewer');
    viewer.innerHTML = `<img src="${d.user.avatar || 'https://i.pravatar.cc/150'}" style="width:200px;height:200px;border-radius:50%;border:4px solid #ff00cc;">`;
    document.getElementById('story-owner').textContent = d.user.full_name;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    this.startStoryProgress();
  },
  getUsernameById(id) {
    return new Promise((res) => {
      api('/api/users').then(d => {
        const u = d.users.find(x => x.id === id);
        res(u ? u.username : '');
      }).catch(() => res(''));
    });
  },
  closeStory() {
    document.getElementById('story-modal').classList.remove('open');
    document.body.style.overflow = '';
    this.stopStoryProgress();
  },
  nextStory() { showToast('Sonraki hikaye'); },
  prevStory() { showToast('Önceki hikaye'); },
  likeStory() { showToast('Beğenildi'); },
  startStoryProgress() {
    const p = document.getElementById('story-progress');
    p.innerHTML = '<div class="story-step"><div class="fill"></div></div>';
    const f = p.querySelector('.fill');
    f.style.animation = 'none'; f.offsetHeight; f.style.animation = 'storyFill 10s linear forwards';
    storyInterval = setTimeout(this.closeStory, 10000);
  },
  stopStoryProgress() { clearTimeout(storyInterval); document.getElementById('story-progress').innerHTML = ''; },

  // ---------- Utils ----------
  goCreatePostShortcut() { this.goCreate(); }
};

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}
function relativeTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const sec = Math.floor((now - d) / 1000);
  if (sec < 60) return 'şimdi';
  if (sec < 3600) return Math.floor(sec / 60) + ' dakika önce';
  if (sec < 86400) return Math.floor(sec / 3600) + ' saat önce';
  return d.toLocaleDateString('tr-TR');
}

document.addEventListener('DOMContentLoaded', () => app.init());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.getElementById('story-modal').classList.remove('open'); app.stopStoryProgress(); } });
</script>

</body>
</html>
